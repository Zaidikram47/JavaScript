<script>
    const newdiv = (divname,classname,id,textname)=>{
        const div = document.createElement(divname)
        console.log(div);
        div.className=classname
        div.id=id
        div.setAttribute('class' , 'heading')
        div.style.color='green'
        const text = document.createTextNode(textname)
        div.appendChild(text)
        document.body.appendChild(div)
    }
